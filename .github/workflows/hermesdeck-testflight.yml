name: TestFlight (internal)

on:
  workflow_dispatch:

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  archive-upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets present?
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          PROFILE_MAIN_B64: ${{ secrets.PROFILE_MAIN_B64 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY P12_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD PROFILE_MAIN_B64; do
            eval "val=\${${name}:-}"       # bash 3.2-safe indirect expansion
            [ -z "$val" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "MISSING:$missing"; exit 1; fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter test

      - name: Write ASC key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" | perl -pe 's/\\n/\n/g' > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Select build number
        env:
          BUNDLE_ID: com.jahmedia.hermesdeck
          MARKETING_VERSION: 2.1.3
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          BUILD_NUMBER=$(ruby ci/select_testflight_build_number.rb)
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "${GITHUB_ENV}"
          echo "Using build number ${BUILD_NUMBER}"

      - name: Install signing assets (local only, no Apple services)
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          PPDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PPDIR"
          printf '%s' "${{ secrets.PROFILE_MAIN_B64 }}" | base64 --decode > "$PPDIR/Main.mobileprovision"

      - name: Build .ipa (signs with local keychain)
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          flutter build ipa --release \
            --build-number "$BUILD_NUMBER" \
            --export-options-plist=ci/HermesDeckExportOptions.plist \
            2>&1 | tee build_log.txt
        # Xcode on the runner has no Apple account; force manual signing to the
        # installed keychain cert + profile via xcodebuild args

      - name: Upload .ipa to TestFlight
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Attach build to Internal Testers
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUNDLE_ID: com.jahmedia.hermesdeck
          BETA_GROUP_NAME: Internal Testers
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: ruby ci/attach_testflight_build.rb || echo "attach failed — attach manually via ASC"
